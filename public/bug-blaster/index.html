<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bug Blaster</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0d1117;
        display: grid;
        place-items: center;
      }
      #game-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      canvas {
        image-rendering: pixelated;
        border: 1px solid #30363d;
        max-width: calc(100vw - 18px);
        max-height: calc(100vh - 70px);
        width: auto;
        height: auto;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #controls {
        display: flex;
        align-items: center;
        gap: 16px;
        font: 13px/1 monospace;
        color: #8b949e;
      }
      #controls .hint {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      #controls .touch-hint {
        display: none;
      }
      @media (hover: none) and (pointer: coarse) {
        #controls .kbd-hint {
          display: none;
        }
        #controls .touch-hint {
          display: flex;
        }
      }
      #controls kbd {
        display: inline-block;
        padding: 2px 7px;
        border: 1px solid #30363d;
        border-bottom-width: 2px;
        border-radius: 4px;
        background: #161b22;
        color: #e6edf3;
        font: inherit;
        line-height: 18px;
      }
    </style>
    <script type="module" crossorigin src="/bug-blaster/assets/index-Cu2hDyjS.js"></script>
  </head>
  <body>
    <div id="game-wrapper">
      <canvas id="game" width="960" height="540"></canvas>
      <div id="controls">
        <span class="hint kbd-hint"><kbd>←</kbd><kbd>→</kbd> move</span>
        <span class="hint kbd-hint"><kbd>Space</kbd> shoot</span>
        <span class="hint touch-hint">drag to move &middot; auto-fires while touching</span>
      </div>
    </div>
  </body>
</html>
